<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>remote-kvm</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #eee; font-family: sans-serif; }
  #video-wrap { position: relative; display: flex; align-items: center; justify-content: center; height: calc(100vh - 56px); }
  #video-wrap img { max-width: 100%; max-height: 100%; }
  #paste-layer { position: absolute; inset: 0; opacity: 0; outline: none; caret-color: transparent; }
  #bar { height: 56px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #1a1a1a; box-sizing: border-box; }
  select, button { font-size: 16px; padding: 6px 10px; }
  #status { margin-left: auto; font-size: 14px; opacity: 0.7; }
  #status.connected { color: #6f6; }
  #status.disconnected { color: #f66; }
  #mobile-input { position: absolute; opacity: 0; height: 1px; width: 1px; }
  #specials { display: flex; gap: 4px; overflow-x: auto; }
</style>
</head>
<body>
  <div id="bar">
    <label for="driver">HID driver:</label>
    <select id="driver">
      <option value="unifying">unifying (radio dongle)</option>
      <option value="esp32">esp32 (wifi)</option>
    </select>
    <div id="specials">
      <button data-code="Escape">Esc</button>
      <button data-code="Tab">Tab</button>
      <button data-code="Enter">Enter</button>
      <button data-code="Backspace">Backspace</button>
      <button data-code="ArrowLeft">&larr;</button>
      <button data-code="ArrowUp">&uarr;</button>
      <button data-code="ArrowDown">&darr;</button>
      <button data-code="ArrowRight">&rarr;</button>
    </div>
    <span id="status" class="disconnected">disconnected</span>
  </div>
  <div id="video-wrap">
    <img id="video" src="/video" alt="live video">
    <div id="paste-layer" contenteditable="true" spellcheck="false"></div>
    <input id="mobile-input" autocomplete="off" autocapitalize="off" autocorrect="off">
  </div>
  <script src="app.js"></script>
</body>
</html>
