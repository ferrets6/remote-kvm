server {
    listen 8093;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Revalidate on every load: without this browsers heuristically cache
        # index.html/app.js and keep serving a stale (or mismatched) UI after a deploy.
        add_header Cache-Control "no-cache";
    }

    location = /video/restart {
        proxy_pass http://driver-video:8091/restart;
    }

    location /video {
        proxy_pass http://driver-video:8091/;
        proxy_buffering off;
    }

    location /ws/hid/unifying {
        proxy_pass http://driver-hid-unifying:8095/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ws/hid/esp32 {
        proxy_pass http://driver-hid-esp32:8096/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
